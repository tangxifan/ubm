<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#28a745"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fd7e14"/>
    </marker>
    <style>
      .boundary { fill: #f8f9fa; stroke: #ced4da; stroke-width: 2; rx: 8; ry: 8; }
      .subbox { fill: #e8f4fd; stroke: #007bff; stroke-width: 1.5; rx: 4; ry: 4; }
      .regbox { fill: #fff3cd; stroke: #ffc107; stroke-width: 1.5; rx: 4; ry: 4; }
      .title { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #212529; text-anchor: middle; }
      .subtitle { font-family: sans-serif; font-size: 10px; font-style: italic; fill: #6c757d; text-anchor: middle; }
      .label { font-family: sans-serif; font-size: 12px; fill: #333; }
      .wire-green { fill: none; stroke: #28a745; stroke-width: 1.5; marker-end: url(#arrow-green); }
      .wire-dark { fill: none; stroke: #333333; stroke-width: 1.5; marker-end: url(#arrow-dark); }
      .wire-orange { fill: none; stroke: #fd7e14; stroke-width: 1.5; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Outer System Boundary -->
  <rect x="40" y="30" width="720" height="390" class="boundary"/>
  <text x="400" y="55" class="title">mult_8_feedback (Multiply with Shifted Feedback)</text>

  <!-- ==================== SUB-BLOCKS ==================== -->

  <!-- Shift Sub-Block on the feedback path -->
  <rect x="300" y="85" width="180" height="50" class="subbox"/>
  <text x="390" y="106" class="title" font-size="12px">Shift Right by 1</text>
  <text x="390" y="123" class="subtitle">a = {p[7], p[7:1]}</text>

  <!-- Combinatorial Multiplier Sub-Block -->
  <rect x="250" y="180" width="220" height="140" class="subbox"/>
  <text x="372" y="240" class="title" font-size="12px">Combinatorial Multiplier</text>
  <text x="372" y="260" class="subtitle">a * b</text>
  <text x="262" y="219" class="label" font-size="10px">op0</text>
  <text x="262" y="289" class="label" font-size="10px">op1</text>

  <!-- Product Register Sub-Block -->
  <rect x="530" y="200" width="110" height="100" class="regbox"/>
  <text x="585" y="245" class="title" font-size="12px">Register</text>
  <text x="585" y="263" class="subtitle">16 bits</text>

  <!-- ==================== INPUT WIRES (LEFT) ==================== -->

  <!-- Input b -->
  <text x="65" y="290" class="label" font-weight="bold">b [7:0]</text>
  <path d="M 130,285 L 250,285" class="wire-green"/>

  <!-- Clock -->
  <text x="65" y="385" class="label" font-weight="bold">clk</text>
  <path d="M 100,380 L 585,380 L 585,300" class="wire-green"/>

  <!-- ==================== INTERNAL WIRES ==================== -->

  <!-- Product to register -->
  <path d="M 470,250 L 530,250" class="wire-dark"/>

  <!-- Feedback: low byte of the registered product, through the shift, to operand 0 -->
  <circle cx="680" cy="250" r="3" fill="#fd7e14"/>
  <path d="M 680,250 L 680,110 L 480,110" class="wire-orange"/>
  <text x="560" y="102" class="label" font-size="10px">p [7:0]</text>
  <path d="M 300,110 L 200,110 L 200,215 L 250,215" class="wire-orange"/>
  <text x="150" y="165" class="label" font-size="10px">a [7:0]</text>

  <!-- ==================== OUTPUT WIRE (RIGHT) ==================== -->

  <!-- Registered product p -->
  <text x="690" y="240" class="label" font-weight="bold">p [15:0]</text>
  <path d="M 640,250 L 745,250" class="wire-dark"/>

</svg>
