<svg xmlns="http://w3.org" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <!-- Inverted bubble marker -->
    <marker id="bubble" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    </marker>
    <style>
      .title { font: bold 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .block-title { font: bold 13px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .block-sub { font: 11px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .port-label { font: bold 12px 'Consolas', 'Courier New', monospace; fill: #0f172a; }
      .wire-label { font: 11px 'Consolas', 'Courier New', monospace; fill: #334155; }
      .mux-num { font: bold 10px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .module-box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6,4; rx: 8; }
      .logic-box { fill: #ffffff; stroke: #1e293b; stroke-width: 2; rx: 4; }
      .reg-box { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 4; }
      .comp-box { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 4; }
      .wire { fill: none; stroke: #1e293b; stroke-width: 1.6; }
      .bus { fill: none; stroke: #1e293b; stroke-width: 2.6; }
      .ctrl-wire { fill: none; stroke: #475569; stroke-width: 1.4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" fill="#ffffff"/>

  <!-- Outer Module Boundary -->
  <rect x="130" y="30" width="600" height="370" class="module-box"/>
  <text x="145" y="54" class="title">counter8_preload_compare (WIDTH = 8)</text>

  <!-- ================= INPUT PORTS (LEFT) ================= -->
  <!-- load_val[7:0] -->
  <text x="20" y="109" class="port-label">load_val[7:0]</text>
  <line x1="115" y1="105" x2="292" y2="105" class="bus" marker-end="url(#arrow)"/>
  <line x1="170" y1="99" x2="162" y2="111" class="wire"/>
  <text x="160" y="95" class="wire-label">8</text>

  <!-- up_down -->
  <text x="48" y="164" class="port-label">up_down</text>
  <line x1="115" y1="160" x2="195" y2="160" class="ctrl-wire"/>
  <line x1="195" y1="160" x2="195" y2="177" class="ctrl-wire" marker-end="url(#arrow)"/>

  <!-- load -->
  <text x="68" y="214" class="port-label">load</text>
  <line x1="115" y1="210" x2="320" y2="210" class="ctrl-wire"/>
  <line x1="320" y1="210" x2="320" y2="188" class="ctrl-wire" marker-end="url(#arrow)"/>

  <!-- en -->
  <text x="82" y="264" class="port-label">en</text>
  <line x1="115" y1="260" x2="438" y2="260" class="ctrl-wire"/>
  <line x1="438" y1="260" x2="438" y2="200" class="ctrl-wire" marker-end="url(#arrow)"/>

  <!-- clk -->
  <text x="75" y="314" class="port-label">clk</text>
  <line x1="115" y1="310" x2="465" y2="310" class="ctrl-wire"/>
  <line x1="465" y1="310" x2="465" y2="200" class="ctrl-wire" marker-end="url(#arrow)"/>

  <!-- rst_n -->
  <text x="62" y="354" class="port-label">rst_n</text>
  <line x1="115" y1="350" x2="495" y2="350" class="ctrl-wire"/>
  <line x1="495" y1="350" x2="495" y2="204" class="ctrl-wire" marker-end="url(#bubble)"/>

  <!-- compare_val[7:0] -->
  <text x="10" y="384" class="port-label">compare_val[7:0]</text>
  <line x1="115" y1="380" x2="625" y2="380" class="bus"/>
  <line x1="625" y1="380" x2="625" y2="308" class="bus" marker-end="url(#arrow)"/>
  <line x1="170" y1="374" x2="162" y2="386" class="wire"/>
  <text x="160" y="370" class="wire-label">8</text>

  <!-- ================= INTERNAL BLOCKS ================= -->

  <!-- 1. Adder / Subtractor (+1 / -1) -->
  <rect x="165" y="180" width="75" height="65" class="logic-box"/>
  <text x="202" y="208" text-anchor="middle" class="block-title">+1 / -1</text>
  <text x="202" y="226" text-anchor="middle" class="block-sub">Inc / Dec</text>

  <!-- Wire from Adder/Sub to Load Mux (Port 0) -->
  <polyline points="240,212 268,212 268,155 292,155" class="bus" marker-end="url(#arrow)"/>

  <!-- 2. Parallel Load Mux (2:1) -->
  <polygon points="295,85 345,102 345,168 295,185" class="logic-box"/>
  <text x="303" y="110" class="mux-num">1</text>
  <text x="303" y="160" class="mux-num">0</text>
  <text x="322" y="139" text-anchor="middle" class="block-title">MUX</text>

  <!-- Wire from Mux to Register D -->
  <line x1="345" y1="135" x2="407" y2="135" class="bus" marker-end="url(#arrow)"/>
  <line x1="378" y1="129" x2="370" y2="141" class="wire"/>
  <text x="371" y="124" class="wire-label">8</text>

  <!-- 3. 8-Bit State Register (DFFs) -->
  <rect x="410" y="95" width="110" height="105" class="reg-box"/>
  <text x="465" y="128" text-anchor="middle" class="block-title">8-bit Reg</text>
  <text x="465" y="145" text-anchor="middle" class="block-sub">Async Reset</text>
  <!-- Pin labels inside register -->
  <text x="418" y="139" class="wire-label">D</text>
  <text x="503" y="139" class="wire-label">Q</text>
  <text x="432" y="192" class="wire-label">EN</text>
  <text x="485" y="192" class="wire-label">CLR</text>
  <!-- Clock triangle -->
  <polyline points="458,200 465,190 472,200" class="wire"/>

  <!-- ================= FEEDBACK & OUTPUT WIRES ================= -->

  <!-- Main Q Output Bus to count[7:0] -->
  <line x1="520" y1="135" x2="745" y2="135" class="bus" marker-end="url(#arrow)"/>
  <line x1="685" y1="129" x2="677" y2="141" class="wire"/>
  <text x="677" y="124" class="wire-label">8</text>
  <text x="752" y="139" class="port-label">count[7:0]</text>

  <!-- Feedback Junction Dot -->
  <circle cx="555" cy="135" r="4" fill="#1e293b"/>

  <!-- Feedback Path to +1/-1 Block -->
  <polyline points="555,135 555,285 148,285 148,215 162,215" class="bus" marker-end="url(#arrow)"/>

  <!-- Branch to Equality Comparator -->
  <circle cx="555" cy="245" r="4" fill="#1e293b"/>
  <polyline points="555,245 582,245" class="bus" marker-end="url(#arrow)"/>

  <!-- 4. 8-Bit Equality Comparator -->
  <rect x="585" y="225" width="90" height="80" class="comp-box"/>
  <text x="630" y="262" text-anchor="middle" class="block-title">==</text>
  <text x="630" y="280" text-anchor="middle" class="block-sub">Compare</text>

  <!-- Comparator Output to match -->
  <line x1="675" y1="265" x2="745" y2="265" class="wire" marker-end="url(#arrow)"/>
  <text x="752" y="269" class="port-label">match</text>

</svg>

